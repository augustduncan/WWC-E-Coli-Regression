name: Deploy Shinylive App

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install dependencies
        uses: r-lib/actions/setup-r-dependencies@v2

      - name: Render predicting.Rmd
        run: |
          Rscript -e 'rmarkdown::render("predicting.Rmd")'

      - name: Commit and push updated files
        run: |
          git config --global user.name "augustduncan"
          git config --global user.email "203911652+augustduncan@users.noreply.github.com"
          
          git add myapp/dashboard_data.csv
          
          if ! git diff --cached --quiet; then
            git commit -m "automated update for today's dashboard data"
            git push
          else
            echo "no changes made!"
          fi

      - name: Build Shinylive assets from root
        run: |
          Rscript -e 'shinylive::export("myapp", "site")'

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
